name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled re-run CI so adding the no-changelog label clears the CHANGELOG check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and name "ci" is the required status check on main (ticket 18). Don't rename it.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      # The Gradle daemon is pinned to Java 21 (android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies and the wrapper. Unlike setup-java's `cache: gradle` (an exact key on
      # the *.gradle files), it restores the closest entry when a build file changes. Entries are written
      # by runs on main; PR runs read them. `basic` is the open-source GitHub Actions cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          add-job-summary: never

      # npm packages are cached by setup-node (~/.npm, keyed on package-lock.json).
      - id: install
        run: npm ci

      # These steps are `npm run check`, split up so each gets its own outcome in the summary.
      # Keep the two lists the same: a check added to `check` in package.json gets a step here
      # (with an id and the same `if`), an OUTCOME_ variable on the summary step, and a row in
      # scripts/ci-summary.mjs. Each runs even when an earlier check failed, so one failure doesn't
      # hide the others' results; none runs if the install failed.
      - id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint -- --format json --output-file reports/eslint.json

      - id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json=reports/vitest.json

      - id: plan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/plan.mjs --check

      - id: changelog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/changelog.mjs --check-format

      # Builds the web app (once), syncs Capacitor, then gradle assembleDebug.
      - id: apk
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run apk

      # versionName and versionCode must come from package.json (Gradle reads it; PLAN-2.md, D8).
      - id: apk_version
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: node scripts/release.mjs --verify-apk android/app/build/outputs/apk/debug/output-metadata.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        with:
          name: app-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Not part of `npm run check`: it needs the PR number. Runs even if a check above failed.
      # The script reads the no-changelog label and the author from the event payload and passes
      # for either exemption.
      - id: changelog_pr
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The base commit lets the script spot a release PR (one that changes the version), which needs no entry.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "Could not fetch the base commit; no release-PR exemption."
          node scripts/changelog.mjs --check-pr "$PR_NUMBER"

      - name: Summary
        if: always()
        env:
          OUTCOME_TYPECHECK: ${{ steps.typecheck.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_PLAN: ${{ steps.plan.outcome }}
          OUTCOME_CHANGELOG: ${{ steps.changelog.outcome }}
          OUTCOME_CHANGELOG_PR: ${{ steps.changelog_pr.outcome }}
          OUTCOME_APK: ${{ steps.apk.outcome }}
          OUTCOME_APK_VERSION: ${{ steps.apk_version.outcome }}
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
