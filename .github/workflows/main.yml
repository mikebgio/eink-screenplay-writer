name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled re-run CI so adding the no-changelog label clears the CHANGELOG check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id and name "ci" is the required status check on main (ticket 18). Don't rename it.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      # The Gradle daemon is pinned to Java 21 (android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci

      # These steps are `npm run check`, split up so each gets its own outcome in the summary.
      # Keep the two lists the same: a check added to `check` in package.json gets a step here
      # (with an id), an OUTCOME_ variable on the summary step, and a row in scripts/ci-summary.mjs.
      - id: typecheck
        run: npm run typecheck

      - id: lint
        run: npm run lint -- --format json --output-file reports/eslint.json

      - id: tests
        run: npm test -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json=reports/vitest.json

      - id: plan
        run: node scripts/plan.mjs --check

      - id: changelog
        run: node scripts/changelog.mjs --check-format

      # Builds the web app (once), syncs Capacitor, then gradle assembleDebug.
      - id: apk
        run: npm run apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Not part of `npm run check`: it needs the PR number. Runs even if a check above failed.
      # The script reads the no-changelog label and the author from the event payload and passes
      # for either exemption.
      - id: changelog_pr
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/changelog.mjs --check-pr "$PR_NUMBER"

      - name: Summary
        if: always()
        env:
          OUTCOME_TYPECHECK: ${{ steps.typecheck.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_PLAN: ${{ steps.plan.outcome }}
          OUTCOME_CHANGELOG: ${{ steps.changelog.outcome }}
          OUTCOME_CHANGELOG_PR: ${{ steps.changelog_pr.outcome }}
          OUTCOME_APK: ${{ steps.apk.outcome }}
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
