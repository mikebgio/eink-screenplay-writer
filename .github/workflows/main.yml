name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # The Gradle daemon is pinned to Java 21 (android/gradle/gradle-daemon-jvm.properties).
      # Fail early if setup-java did not put JDK 21 first on the path.
      - name: Check Java version
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | grep -q 'version "21' || { echo "Expected JDK 21"; exit 1; }

      - name: Install Android SDK packages if missing
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null
            "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          fi

      - run: npm ci
      - run: npm run apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
