version: 2

# One combined version-update PR per ecosystem per week (the "all" group, which
# has no applies-to, so it covers version updates only). Security updates keep
# their own individual PRs, so they are not held behind the group.
# New releases wait 14 days before Dependabot proposes them (cooldown does not
# apply to security updates). The "[Chore]" prefix gives titles "[Chore]: ...".

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[Chore]"
    groups:
      all:
        patterns:
          - "*"
    # typescript-eslint 8.x caps its peer range at typescript <6.1.0, so a
    # TypeScript 7 bump breaks lint and typecheck. Hold majors until it supports 7.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[Chore]"
    groups:
      all:
        patterns:
          - "*"
    # Gradle 9.6+ removed internal APIs that AGP 8.13.0 uses. Hold the wrapper's
    # major version until AGP is upgraded.
    ignore:
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "[Chore]"
    groups:
      all:
        patterns:
          - "*"
